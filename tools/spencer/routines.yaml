    cron_id: digest-midday
    schedule: daily 12:30 America/Chicago
    purpose: Midday intelligence digest for the Brian->Gemini paste loop
    produces:
      tables: [altair.research_digest]
      files: ["~/workspace/digests/"]
    owner: null

