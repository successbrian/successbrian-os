# proxmox-bond-fabric.cfg
# PURPOSE: LACP bond of 3x 1GbE for the NVMe-oF fabric on DL380 Proxmox hosts.
# WHY: ~330MB/s aggregate to the fabric; the 4th 1GbE stays on the LAN for mgmt.
# CALLED BY: copy into /etc/network/interfaces.d/fabric (Proxmox VE 8, ifupdown2),
#            then ifreload -a. Adjust interface names to `ip link` output and the
#            fabric subnet to your LAN plan.
# NOTES: switch ports must be in an LACP group. layer3+4 hashing spreads the
#        multiple nvme-tcp connections across the three links.

auto bond0
iface bond0 inet static
    address 10.20.30.21/24
    bond-slaves eno2 eno3 eno4
    bond-miimon 100
    bond-mode 802.3ad
    bond-xmit-hash-policy layer3+4
    bond-lacp-rate 1
    mtu 1500
    # fabric-only: no gateway here; LAN/mgmt stays on eno1 with its own gateway
