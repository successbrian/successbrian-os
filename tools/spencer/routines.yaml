# Spencer routine registry
# WHY: one catalog of every recurring job Spencer runs — what it does, what it
#   produces, where output lands. The cron scheduler is the source of truth for
#   timing; this file is the catalog. Never document a guess as a fact: every
#   entry must match an actual cron id (see `cron.list`).
# NOTES: goal-owned routines keep their owner; their output stays in that
#   goal's workspace per cron policy.

routines:
  - id: digest-midday
    cron_id: digest-midday
    schedule: daily 12:30 America/Chicago
    purpose: Midday intelligence digest for the Brian->Gemini paste loop
    produces:
      tables: [altair.research_digest]
      files: ["~/workspace/digests/"]
    owner: null

  - id: digest-evening
